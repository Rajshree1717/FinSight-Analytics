<!DOCTYPE html>
<html>
<head>
    <title>Edit Customer</title>
</head>
<body>

<h2>Edit Customer</h2>

<form method="POST">

    <input type="text" name="name" value="{{ customer[1] }}" required><br><br>

    <input type="email" name="email" value="{{ customer[2] }}" required><br><br>

    <input type="text" name="city" value="{{ customer[3] }}" required><br><br>

    <input type="text" name="state" value="{{ customer[4] }}" required><br><br>

    <button type="submit">Update Customer</button>

</form>

</body>
</html>
