<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Product</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f4f6f9;
}

.container{
margin-top:50px;
}

.card{
border:none;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

</style>

</head>

<body>

<div class="container">

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card p-4">

<h2 class="mb-4 text-center">
Edit Product
</h2>

<form method="POST">

<div class="mb-3">

<label>Product Name</label>

<input
type="text"
name="name"
class="form-control"
value="{{ product[1] }}"
required>

</div>

<div class="mb-3">

<label>Category</label>

<input
type="text"
name="category"
class="form-control"
value="{{ product[2] }}"
required>

</div>

<div class="mb-3">

<label>Price</label>

<input
type="number"
step="0.01"
name="price"
class="form-control"
value="{{ product[3] }}"
required>

</div>

<div class="mb-3">

<label>Stock</label>

<input
type="number"
name="stock"
class="form-control"
value="{{ product[4] }}"
required>

</div>

<div class="text-center">

<button class="btn btn-warning">
Update Product
</button>

<a href="/products" class="btn btn-secondary">
Cancel
</a>

</div>

</form>

</div>

</div>

</div>

</div>

</body>
</html>
