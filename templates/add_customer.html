<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Customer | FinSight Analytics</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f6f9;
        }

        .container-box{
            max-width:700px;
            margin:50px auto;
        }

        .card{
            border:none;
            border-radius:15px;
            box-shadow:0 4px 10px rgba(0,0,0,0.15);
        }
    </style>

</head>
<body>

<div class="container container-box">

    <div class="card">

        <div class="card-header bg-primary text-white">
            <h3>Add New Customer</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Customer Name</label>
                    <input type="text"
                           name="name"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email"
                           name="email"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">City</label>
                    <input type="text"
                           name="city"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">State</label>
                    <input type="text"
                           name="state"
                           class="form-control"
                           required>
                </div>

                <button type="submit" class="btn btn-success">
                    Save Customer
                </button>

                <a href="/customers" class="btn btn-secondary">
                    Back
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
