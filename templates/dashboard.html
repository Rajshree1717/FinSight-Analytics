<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinSight Analytics Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body{
            background:#f4f6f9;
            font-family:Arial, Helvetica, sans-serif;
        }

        .sidebar{
            width:250px;
            height:100vh;
            background:#1f2937;
            position:fixed;
            color:white;
        }

        .sidebar h3{
            text-align:center;
            padding:20px;
            border-bottom:1px solid #444;
        }

        .sidebar a{
            display:block;
            color:white;
            text-decoration:none;
            padding:15px 25px;
        }

        .sidebar a:hover{
            background:#374151;
        }

        .content{
            margin-left:250px;
            padding:30px;
        }

        .card{
            border:none;
            border-radius:15px;
            box-shadow:0 4px 12px rgba(0,0,0,.1);
        }

        .kpi{
            font-size:32px;
            font-weight:bold;
        }

        .chart-card{
            margin-top:25px;
        }
    </style>

</head>
<body>

<div class="sidebar">

    <h3>FinSight</h3>

    <a href="/dashboard">🏠 Dashboard</a>
    <a href="/customers">👥 Customers</a>
    <a href="/products">📦 Products</a>
    <a href="/sales">📈 Sales</a>
    <a href="/reports">📄 Reports</a>

</div>

<div class="content">

    <h2 class="mb-4">Business Dashboard</h2>

    <div class="row">

        <div class="col-md-3">

            <div class="card text-center p-3">

                <h6>Total Customers</h6>

                <div class="kpi text-primary">
                    {{ customers }}
                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card text-center p-3">

                <h6>Total Products</h6>

                <div class="kpi text-success">
                    {{ products }}
                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card text-center p-3">

                <h6>Total Orders</h6>

                <div class="kpi text-warning">
                    {{ orders }}
                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card text-center p-3">

                <h6>Total Revenue</h6>

                <div class="kpi text-danger">
                    ₹{{ revenue }}
                </div>

            </div>

        </div>

    </div>

    <div class="row">

        <div class="col-md-8">

            <div class="card chart-card p-3">

                <h5>Monthly Sales</h5>

                <canvas id="salesChart"></canvas>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card chart-card p-3">

                <h5>Product Categories</h5>

                <canvas id="pieChart"></canvas>

            </div>

        </div>

    </div>

</div>

<script>

new Chart(document.getElementById("salesChart"),{

    type:"line",

    data:{

        labels:["Jan","Feb","Mar","Apr","May","Jun","Jul"],

        datasets:[{

            label:"Revenue",

            data:[12000,18000,22000,26000,30000,35000,42000],

            borderWidth:3,

            fill:false

        }]

    }

});


new Chart(document.getElementById("pieChart"),{

    type:"pie",

    data:{

        labels:["Electronics","Fashion","Books","Sports"],

        datasets:[{

            data:[40,25,20,15]

        }]

    }

});

</script>

</body>
</html>
