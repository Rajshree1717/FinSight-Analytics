<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customers | FinSight Analytics</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f6f9;
}

.sidebar{
    width:250px;
    height:100vh;
    background:#1f2937;
    position:fixed;
}

.sidebar h3{
    color:white;
    text-align:center;
    padding:20px;
}

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:15px 25px;
}

.sidebar a:hover{
    background:#374151;
}

.content{
    margin-left:250px;
    padding:30px;
}

.card{
    border:none;
    border-radius:15px;
    box-shadow:0 3px 10px rgba(0,0,0,.1);
}

</style>

</head>

<body>

<div class="sidebar">

<h3>FinSight</h3>

<a href="/dashboard">🏠 Dashboard</a>
<a href="/customers">👥 Customers</a>
<a href="/products">📦 Products</a>
<a href="/sales">📈 Sales</a>
<a href="/reports">📄 Reports</a>

</div>

<div class="content">

<div class="d-flex justify-content-between mb-4">

<h2>Customer Management</h2>

<a href="/add_customer" class="btn btn-primary">
+ Add Customer
</a>

</div>

<div class="card p-4">

<form method="GET" action="/customers">

<div class="row mb-3">

<div class="col-md-8">

<input
type="text"
name="search"
class="form-control"
placeholder="Search customer...">

</div>

<div class="col-md-4">

<button class="btn btn-success w-100">
Search
</button>

</div>

</div>

</form>

<table class="table table-striped">

<thead>

<tr>
<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>City</th>
<th>State</th>
<th>Actions</th>
</tr>

</thead>

<tbody>

{% for customer in customers %}

<tr>

<td>{{ customer[0] }}</td>
<td>{{ customer[1] }}</td>
<td>{{ customer[2] }}</td>
<td>{{ customer[3] }}</td>
<td>{{ customer[4] }}</td>

<td>

<a href="/edit_customer/{{ customer[0] }}" class="btn btn-warning">Edit</a>

<a href="/delete_customer/{{ customer[0] }}"
   class="btn btn-danger"
   onclick="return confirm('Delete this customer?')">
   Delete
</a>
</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

</body>
</html>
